<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World lifecycle check</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement, StrictMode } from 'react';
      import { createRoot } from 'react-dom/client';
      import { App } from '/src/app/App.tsx';
      import '/src/styles/global.css';

      const visibility = new Set();
      const preferences = new Set();
      const addDocument = document.addEventListener.bind(document);
      const removeDocument = document.removeEventListener.bind(document);
      document.addEventListener = (type, listener, options) => {
        if (type === 'visibilitychange') visibility.add(listener);
        addDocument(type, listener, options);
      };
      document.removeEventListener = (type, listener, options) => {
        if (type === 'visibilitychange') visibility.delete(listener);
        removeDocument(type, listener, options);
      };
      const addMedia = MediaQueryList.prototype.addEventListener;
      const removeMedia = MediaQueryList.prototype.removeEventListener;
      MediaQueryList.prototype.addEventListener = function (type, listener, options) {
        if (type === 'change' && this.media.includes('prefers-reduced-motion'))
          preferences.add(listener);
        addMedia.call(this, type, listener, options);
      };
      MediaQueryList.prototype.removeEventListener = function (type, listener, options) {
        preferences.delete(listener);
        removeMedia.call(this, type, listener, options);
      };
      let root;
      window.worldFixture = {
        mount() {
          root = createRoot(document.getElementById('root'));
          root.render(createElement(StrictMode, null, createElement(App)));
        },
        unmount() {
          root.unmount();
        },
        read() {
          return { visibility: visibility.size, preferences: preferences.size };
        },
      };
      window.worldFixture.mount();
    </script>
  </body>
</html>
